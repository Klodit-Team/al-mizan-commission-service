version: '3.8'

services:
  commission-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: commission-service
    ports:
      - "8007:8007"
    environment:
      - PORT=8007
      - DB_HOST=commission-mysql
      - DB_PORT=3306
      - DB_USERNAME=commission
      - DB_PASSWORD=commission_secret
      - DB_DATABASE=commission_db
      - RABBITMQ_URL=amqp://guest:guest@al-mizan-rabbitmq:5672
      - MINIO_ENDPOINT=al-mizan-minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - NODE_ENV=development
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - al-mizan-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: commission-mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_secret
      - MYSQL_DATABASE=commission_db
      - MYSQL_USER=commission
      - MYSQL_PASSWORD=commission_secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - al-mizan-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  al-mizan-network:
    name: al-mizan-network
    external: true
